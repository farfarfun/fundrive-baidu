[project]
name = "fundrive-baidu"
version = "2.0.91"
description = "百度网盘（BaiduPCS）云存储 API 封装"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [ "cryptography>=44.0.0", "farcache>=2.0.3", "farlog>=1.1.7", "passlib>=1.7.4", "pillow>=10.4.0", "requests>=2.32.3", "requests-toolbelt>=1.0.0", "rich>=13.9.4",]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"
[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"
[project.urls]
Organization = "https://github.com/farfarfun-drive"
Repository = "https://github.com/farfarfun-drive/fundrive-baidu"
Releases = "https://github.com/farfarfun-drive/fundrive-baidu/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fundrives"]

[dependency-groups]
dev = [ "pytest>=7.0", "ruff>=0.14.0", "tomli>=2.0; python_version < '3.11'",]

[tool.ruff]
target-version = "py310"      # 与 requires-python = ">=3.10" 对齐
src = ["src", "tests"]

[tool.ruff.lint]
# 显式固定规则集。不写 select 就吃 ruff 的默认值，而默认值会随 ruff 升级变宽 ——
# 那样 CI 的红绿取决于当天装到哪个 ruff 版本，而不是代码改了什么。
select = ["E4", "E7", "E9", "F", "I"]
ignore = [
    # farlog（基于 loguru）的日志调用用 `{}` 占位符传参，不是 stdlib logging 的
    # `%s` 语法；ruff 把 logger 调用当成 stdlib logging 处理，误判为参数过多。
    # 当前 select 不含 PLE，这条留着是为了以后放宽 select 时不回归。
    "PLE1205",
]
